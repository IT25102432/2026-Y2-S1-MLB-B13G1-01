spring.application.name=showtime-management

# H2 in-memory database - resets each run, no setup required
spring.datasource.url=jdbc:h2:mem:moviesphere;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Browse the live data at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Disable browser caching of static assets during development, so a browser
# refresh always picks up the latest index.html/css/js instead of a stale
# cached copy from a previous run.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.chain.cache=false
