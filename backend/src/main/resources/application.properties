# CineBook Application Configuration
server.port=8080
spring.application.name=cinebook-movie-reservation-system

# In-Memory H2 Database Settings
spring.datasource.url=jdbc:h2:mem:cinebook_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Initialization with schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Static Resources Handling
spring.web.resources.static-locations=classpath:/static/