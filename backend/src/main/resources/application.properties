# Server Port
server.port=8080

# Application Name
spring.application.name=MovieReservationSystem

# Database Connection (Microsoft SQL Server / SSMS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MovieReservationDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Password123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect